# Container deployment for the jpassvault sync server.
# Copy deploy/jpassvaultserver.env.example to deploy/jpassvaultserver.env, set
# JPASSVAULT_SECRET, then: docker compose up -d
services:
  jpassvaultserver:
    image: ghcr.io/samyisok/jpassvaultserver:2.0.0
    restart: unless-stopped
    env_file:
      - ./deploy/jpassvaultserver.env
    environment:
      # Only because a TLS-terminating proxy is expected in front. Remove when
      # TLS is configured in-process.
      APP_PROPERTIES_ALLOW_PLAIN_HTTP: "true"
    ports:
      - "127.0.0.1:9393:9393"
    volumes:
      - jpassvault-data:/app/data

volumes:
  jpassvault-data:
