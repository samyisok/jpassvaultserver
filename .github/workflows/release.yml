name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version=$(sed -nE "s/^version = '([^']+)'.*/\1/p" build.gradle | head -1)
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.gradle version $gradle_version" >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build release jar
        run: ./gradlew --no-daemon clean bootJar

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: build/libs
          format: cyclonedx-json
          output-file: dist/jpassvaultserver-${{ env.VERSION }}-sbom.cdx.json
          artifact-name: ''

      - name: Generate checksums
        shell: bash
        run: |
          cp build/libs/jpassvaultserver-*.jar dist/
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${VERSION}"
          awk -v want="## [$version]" '
            !capture && index($0, want) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d' > body.md
          {
            echo "## $version"
            echo
            if [ -s body.md ]; then cat body.md; else echo "No CHANGELOG.md section for $version."; fi
          } > notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*
          fail_on_unmatched_files: true
