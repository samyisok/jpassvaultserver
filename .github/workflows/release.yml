name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version=$(sed -nE "s/^version = '([^']+)'.*/\1/p" build.gradle | head -1)
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.gradle version $gradle_version" >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Compute image tags
        shell: bash
        run: |
          # Move :latest only for a stable (non-pre-release) version.
          tags="ghcr.io/${{ github.repository }}:${VERSION}"
          case "${VERSION}" in
            *-*) : ;;
            *) tags="${tags}
          ghcr.io/${{ github.repository }}:latest" ;;
          esac
          {
            echo "IMAGE_TAGS<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build and verify release
        # Runs tests, coverage verification, Checkstyle, and builds the boot jar.
        run: ./gradlew --no-daemon clean build

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/libs
          format: cyclonedx-json
          output-file: dist/jpassvaultserver-${{ env.VERSION }}-sbom.cdx.json
          artifact-name: ''

      - name: Generate checksums
        shell: bash
        run: |
          cp build/libs/jpassvaultserver-*.jar dist/
          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${VERSION}"
          awk -v want="## [$version]" '
            !capture && index($0, want) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/./,$!d' > body.md
          {
            echo "## $version"
            echo
            if [ -s body.md ]; then cat body.md; else echo "No CHANGELOG.md section for $version."; fi
          } > notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: true
          tags: ${{ env.IMAGE_TAGS }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: notes.md
          files: |
            dist/*
          fail_on_unmatched_files: true
