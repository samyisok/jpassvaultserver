name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Runs build, tests, JaCoCo coverage verification, and Checkstyle.
      - name: Build, test, coverage, static analysis
        run: ./gradlew --no-daemon clean build

      - name: Dependency vulnerability scan
        # Pinned to the v1.1.0 commit (not a mutable branch).
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600
        with:
          project: jpassvaultserver
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload test, coverage, and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/checkstyle
          if-no-files-found: warn
