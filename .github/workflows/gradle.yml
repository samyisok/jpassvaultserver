name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Exposed so the scan step can check whether a key is configured
      # (the `secrets` context is not allowed in `if` expressions).
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Runs build, tests, JaCoCo coverage verification, and Checkstyle.
      - name: Build, test, coverage, static analysis
        run: ./gradlew --no-daemon clean build

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml

      - name: Verify installer in a container
        run: ./deploy/install-verify.sh

      - name: Dependency vulnerability scan
        # Requires the NVD_API_KEY repository secret (dependency-check >= 9);
        # skipped when it is absent, with Dependabot still providing alerts.
        if: ${{ env.NVD_API_KEY != '' }}
        # Pinned to the v1.1.0 commit (not a mutable branch).
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600
        with:
          project: jpassvaultserver
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired
            --nvdApiKey ${{ env.NVD_API_KEY }}

      - name: Upload test, coverage, and analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/checkstyle
          if-no-files-found: warn
